<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>meusite/login</title>
</head>
<body>
    <main class="container">
        <h1>CADASTRO</h1>
        <form action="meusite.html">
            <div class="input-box">
                <label for="usuario">E-mail
                    <input type="name" placeholder="Digite seu email" required>
                </label>
            </div>
            <div class="input-box">
                <label for="senha" >Senha
                    <input type="password" placeholder="Digite sua senha" required>
                </label>
            </div>
            <div class="lembrar-esquecer">
                <label for="checkbox">
                    <input type="checkbox"> Lembrar senha
                </label>
                <a href="#">Esqueci a senha</a>
            </div>
            <button type="submit" class="entrar">Entrar</button>
            <div class="registro">
                <p>Não tem conta?<a href="#">Criar conta</a></p>
            </div>
        </form>
    </main>

</body>

</html>
